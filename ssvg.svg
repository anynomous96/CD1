<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    rect {
      fill: #e95835;
      transform-origin: center;
      animation: signal-pulse 2.4s ease-in-out infinite;
    }
    rect:nth-child(1) { animation-delay: 0s; }
    rect:nth-child(2) { animation-delay: 0.18s; }
    rect:nth-child(3) { animation-delay: 0.36s; }
    
    @keyframes signal-pulse {
      0%, 100% { transform: scaleY(1); opacity: 1; }
      50% { transform: scaleY(0.6); opacity: 0.7; }
    }
  </style>
  <rect x="3" y="7.5" width="4" height="9" rx="1" />
  <rect x="10" y="1.5" width="4" height="21" rx="1" />
  <rect x="17" y="5" width="4" height="14" rx="1" />
</svg>
